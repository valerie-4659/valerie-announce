# Posts a release announcement to @valeries_apps.
#
# Two triggers on purpose. The dispatch is the fast path: a project's release
# workflow pokes this one the moment its release exists, so the post follows
# within a minute. The schedule is the safety net for every project not wired
# up yet, and it also keeps the workflow alive - GitHub switches scheduled
# workflows off after 60 days without a commit on a repo, and a quiet month
# would otherwise disable the announcer silently.
#
# This repository is public, so Actions minutes are free. It holds no code
# worth hiding: the credentials are secrets, and secrets are not available to
# workflows triggered from forks.
name: Announce

on:
  schedule:
    # Every three hours. A release announcement is not time-critical, and the
    # dispatch trigger already covers the case where it should be.
    - cron: "17 */3 * * *"
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      dry:
        description: "Compose the posts and print them, send nothing"
        type: boolean
        default: true
      only:
        description: "One hub repository, e.g. crossposthelper-app"
        required: false
      max_age_hours:
        description: "Ignore releases older than this"
        default: "72"

permissions:
  contents: write

concurrency:
  # Two runs at once would each read the same state file and post twice.
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: The composer still does what it is supposed to
        run: npm test

      - name: Announce
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/announce.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '--dry' || '' }} \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            --max-age-hours "${{ inputs.max_age_hours || '72' }}" \
            --max-posts 3

      - name: Record what went out
        run: |
          if git diff --quiet -- state/posted.json; then
            echo "Nothing new was announced."
            exit 0
          fi
          git config user.name "valerie-4659"
          git config user.email "264322489+valerie-4659@users.noreply.github.com"
          git add state/posted.json
          git commit -m "chore: record the releases announced"
          git push
